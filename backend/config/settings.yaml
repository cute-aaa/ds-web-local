# 全局设置
# 字符串值支持环境变量插值（仅整串匹配）：${VAR} 用环境变量替换；
# ${VAR:-default} 变量未设置时用 default。例：port: ${DS_PORT:-8088}
server:
  host: 127.0.0.1
  port: 8088
  title: "DS Web Local"
  description: "可插拔的本地 Agent 能力中台"
  version: "3.0.0"

logging:
  level: INFO
  file: logs/app.log
  rotation: "10 MB"
  retention: "30 days"
  sensitive_keys: ["command", "arguments", "password", "token", "authorization", "api_key"]

concurrency:
  max_requests: 10
  queue_timeout: 30

health:
  check_interval: 30
  startup_wait: 3
  retries: 3

timeouts:
  default: 120

security:
  auth_enabled: false
  auth_token: ""
  rate_limit: "60/minute"
  # 工具审批：命中列表的工具调用先进入审批队列（POST /api/approvals），批准后前端重试
  # 本地单机默认关闭；局域网/多端接入或对敏感操作可在设置中开启
  approval_enabled: false
  approval_required_tools: ["terminal_run"]

# 桥接可靠性 / 工具结果附件
# 每次工具调用默认落盘 data/attachments/<caller_id>/<date>/result_<request_id>.json，
# 以下策略控制服务端清理：启动时 + 每 24h 触发 sweep_attachments()
bridge:
  attachment_retention_days: 7      # 附件保留天数；0=不清理
  attachment_max_per_caller: 500    # 每个 caller 最多保留文件数（超出删最旧）；0=不限
  # 结果内联阈值：序列化后超过该长度 → 响应只回摘要 + 附件路径（完整内容在附件文件里）
  # 调小 = 更省上下文，但模型要额外 read_file 取全量（多一次往返）；调大反之。
  inline_max_chars: 20000
  summary_max_chars: 8000           # 大结果回填的摘要上限（字符）

# 网络工具（web_fetch / web_search）
web:
  # 搜索引擎 HTML 端点；支持 {query} 占位，或直接以 "?q=" 结尾（自动追加编码查询词）
  search_url: "https://html.duckduckgo.com/html/?q="

skills:
  enabled: true
  storage: config/skills.json
  # SKILL.md 多根发现（相对 backend/ 或绝对路径均可），按优先级：bundled > user > custom
  # 支持任意位置：网盘/共享盘/Git 仓库的 SKILL.md 库（source 标记为 custom）
  skills_dirs: ["skills", "data/user-skills"]
  # 只读导入源：D:/Hermes/skills（演示导入用，默认关闭；开启后可在控制台一键导入）
  hermes_import_ro: true
  hermes_import_dir: "D:/Hermes/skills"
  # role_card 技能清单 description 截断长度
  catalog_description_max_length: 500

# 本地监听线程（0=关闭对应监听）
watcher:
  config_interval: 5    # mcp.json/settings.yaml 变更检测（秒）→ MCP 服务热重载
  skills_interval: 5    # 技能目录变更检测（秒）→ catalog/digest 自动刷新

# 可选双模式（Phase 11）：本地 LLM 后端
llm:
  base_url: https://api.deepseek.com
  api_key: ""
  model: deepseek-chat
